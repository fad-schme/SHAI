# High-confidence rules shared by input, output, tool-result, and file scans.
# Boundary overlays must not repeat rule names owned here.
patterns:
  - name: prompt_extraction.compound
    meta:
      description: "Disclosure or exactness request targeting protected or referential prompt content"
      threat_level: 5
      severity: high
      category: prompt_extraction
    strings:
      disclosure_operation: >-
        (?ix)\b(?:repeat|recite|dump|reproduce|copy(?:\s+and\s+paste)?|serialize
        |encode|translate|print|output|reveal|show(?:ing)?|quote|return|share|echo|list|give
        |write|summarize|leak|reverse|complete|include|explain|review|see
        |what\s+was\s+in)\b
      protected_object: >-
        (?ix)(?:\b(?:system\s+prompt|hidden\s+(?:prompt|instructions?|prefixes?)
        |initial\s+(?:prompt|instructions?|context)|developer\s+message
        |system\s+(?:message|instructions?)|instruction\s+set|setup\s+instructions?
        |(?:your|internal|system|safety)\s+polic(?:y|ies)|full\s+context|context\s+window)\b
        |\b(?:your|the\s+model(?:'s)?)\s+(?:entire\s+|full\s+|original\s+)?prompt\b
        |\b(?:your\s+)?instructions?\s+in\s+(?:your|the)\s+context\b
        |\bhidden\s+(?:rules?|restrictions?)\b
        |\bevery\s+(?:rule|guideline)\s+you(?:'re|\s+are)\s+(?:currently\s+)?operating\s+under\b)
      referential_target: >-
        (?ix)(?:\b(?:words?|text|everything|all\s+(?:text|content))\s+
        (?:(?:that\s+)?(?:appears?|is)\s+|written\s+)?(?:above|before)\b
        |\b(?:instructions?|guidelines?)\s+(?:you\s+were|that\s+were)\s+(?:given|told)\b
        |\btop\s+of\s+(?:your\s+|the\s+)?context\b
        |\bwhat\s+(?:text\s+)?preceded\s+(?:this|the)\s+conversation\b
        |\b(?:text|content)\s+that\s+came\s+before\b|\bbefore\s+i\s+started\s+talking\b
        |\b(?:instructions?|guidelines?)\s+you\s+(?:received|were\s+sent)\b
        |\bevery\s+(?:token|character|word)\s+above\b)
      exactness_modifier: >-
        (?ix)\b(?:verbatim|exact(?:ly)?|every\s+token|every\s+character|character[-\s]+for[-\s]+character
        |word[-\s]+for[-\s]+word|unchanged|raw\s+text|json\s+format|code\s+block|base64|fully)\b
    match:
      within_chars: 220
      all:
        - name: disclosure_request
          any: [disclosure_operation, exactness_modifier]
        - name: protected_target
          any: [protected_object, referential_target]

  - name: tool_coercion.exfiltration
    meta:
      description: "Tool invocation that sends sensitive data to an attacker-controlled destination"
      threat_level: 5
      severity: high
      category: tool_injection
    strings:
      tool_imperative: >-
        (?ix)(?:
          (?:^|[.!?]\s+)(?:please\s+|silently\s+|immediately\s+|you\s+(?:must|should)\s+)?
          (?:call|invoke|use|execute|run|trigger)\s+(?:the\s+)?(?:following\s+)?[a-z_][\w.-]*
          |\b(?:instruct|require)s?\s+you\s+to\s+(?:call|invoke|use|execute|run)\s+[a-z_][\w.-]*
          |\b(?:and|then)\s+(?:call|invoke|use|execute|run)\s+[a-z_][\w.-]*
          |\bmake\s+an?\s+outbound\s+http\s+request\b
          |\bplease\s+chain\b.{0,100}\bsend_email\b
        )
      sensitive_source: >-
        (?ix)\b(?:system[_\s-]+prompts?|hidden\s+instructions?|credentials?|secrets?
        |passwords?|api[_\s-]+keys?|access[_\s-]+tokens?|(?:environment|env)[_\s-]+variables?
        |conversation(?:\s+(?:history|transcripts?))?|all\s+(?:your\s+)?(?:conversation\s+)?context
        |verification\s+codes?
        |customer\s+data|database\s+(?:contents?|dump)|private\s+files?|user[_\s-]+(?:data|secrets)
        |all\s+data|search\s+results?)\b
      external_attacker_destination: >-
        (?ix)(?:\b[\w.+-]*attacker[\w.+-]*@[\w.-]+\b
        |\b[\w.-]*(?:evil|attacker|malicious)[\w.-]*\.(?:com|net|org)\b
        |\bhttps?://[\w.-]*(?:evil|attacker|malicious)[\w.-]*(?:/[\w?=&%./<>-]*)?
        |\battacker(?:'s)?\s+(?:phone|address|endpoint|account)\b)
    match:
      all:
        - name: tool_action
          any: [tool_imperative]
        - name: sensitive_data
          any: [sensitive_source]
        - name: external_destination
          any: [external_attacker_destination]

  - name: tool_coercion.destructive_action
    meta:
      description: "Tool invocation combined with destructive data, repository, or shell action"
      threat_level: 5
      severity: high
      category: tool_injection
    strings:
      tool_imperative: >-
        (?ix)(?:
          (?:^|[.!?]\s+)(?:please\s+|silently\s+|immediately\s+|you\s+(?:must|should)\s+)?
          (?:call|invoke|use|execute|run|trigger)\s+(?:the\s+)?(?:following\s+)?[a-z_][\w.-]*
          |\b(?:instruct|require)s?\s+you\s+to\s+(?:call|invoke|use|execute|run)\s+[a-z_][\w.-]*
          |\bfor\s+every\b.{0,50}\bcall\s+reset_password\b
        )
      destructive_action: >-
        (?ix)(?:\b(?:delete|remove|erase|wipe|destroy)\b.{0,30}\b(?:all|files?|records?|tables?|users?|system)
        |\bdrop\s+table\b|\boverwrite\b|\breset[_\s-]+passwords?\b|\bforce[_\s-]*push\b
        |\b(?:rm\s+-rf|run[_\s-]*shell|exec\s*\(|curl\b.{0,50}\|\s*(?:sh|bash)
        |nc\b.{0,50}\s-e\s+(?:/bin/)?sh|/bin/(?:sh|bash)|delete[_\s-]*all)\b)
    match:
      all:
        - name: tool_action
          any: [tool_imperative]
        - name: destructive_operation
          any: [destructive_action]

  - name: tool_coercion.privilege_mutation
    meta:
      description: "Tool invocation combined with privilege or security-control mutation"
      threat_level: 5
      severity: high
      category: tool_injection
    strings:
      tool_imperative: >-
        (?ix)(?:
          (?:^|[.!?]\s+)(?:please\s+|silently\s+|immediately\s+|you\s+(?:must|should)\s+)?
          (?:call|invoke|use|execute|run|trigger)\s+(?:the\s+)?(?:following\s+)?[a-z_][\w.-]*
          |\b(?:instruct|require)s?\s+you\s+to\s+(?:call|invoke|use|execute|run)\s+[a-z_][\w.-]*
        )
      privilege_mutation: >-
        (?ix)(?:\badd[_\s-]+admin\b|\bgrant[_\s-]+access\b
        |\b(?:create|add)\b.{0,25}\b(?:admin|root|privileged)\s+(?:user|account|role)\b
        |\b(?:role|permissions?)\s*[:=]\s*['"]?(?:admin|root|\*)\b
        |\bdisable[_\s-]+(?:2fa|mfa)\b|\bsecurity(?:\.enabled|\s+enabled)?\s*[:=]\s*false\b
        |\b(?:make|set)\b.{0,20}\b(?:repository|files?|documents?)\b.{0,20}\bpublic\b
        |\bpermissions?\s*[:=]\s*['"]?public\b|\bwrite\b.{0,20}\bpublic\s+location\b)
    match:
      all:
        - name: tool_action
          any: [tool_imperative]
        - name: privilege_change
          any: [privilege_mutation]

  - name: tool_coercion.financial_action
    meta:
      description: "Financial tool action combined with an amount, account, card, or recipient"
      threat_level: 5
      severity: high
      category: tool_injection
    strings:
      financial_action: >-
        (?ix)(?:\b(?:call|invoke|use|execute|run)\b.{0,25}\b(?:transfer[_\s-]*funds?
        |payment[_\s-]*(?:processor|tool)|charge[_\s-]*(?:card|account)|wire[_\s-]*transfer)\b
        |\b(?:transfer|charge|pay|wire)\b.{0,20}\b(?:funds?|money|payment|account|card|recipient)\b)
      financial_target: >-
        (?ix)(?:[$€£]\s?\d[\d,.]*|\b\d[\d,.]*\s*(?:usd|eur|gbp|dollars?|euros?|pounds?)\b
        |\b(?:account|recipient|card|wallet|routing\s+number|iban)\b.{0,30}\b[\w*-]{3,}\b)
    match:
      all:
        - name: financial_tool_action
          any: [financial_action]
        - name: financial_target
          any: [financial_target]

  # Indirect injection: content that stops addressing its human reader and
  # starts addressing the model. The load-bearing signal is the *vocative* —
  # "[AI: ...]", "note to AI assistants reading this", "[Assistant, ...]" —
  # not the mention of AI. Benign text discusses AI in the third person ("the
  # AI safety paper recommends never allowing send_email"); an injected note
  # speaks to it directly.
  #
  # Source-context markers ("search result:", "README excerpt:", "PDF page 3:")
  # are deliberately NOT a required group. Every corpus instance has one, but
  # the set is open-ended — every document type in existence — while the
  # addressee is a small structural pattern. Requiring the marker would cost
  # recall on unseen document types and buy no precision the addressee does not
  # already provide.
  - name: indirect_injection.embedded_agent_directive
    meta:
      description: "Content addressed to the model rather than its reader, carrying an instruction"
      threat_level: 5
      severity: high
      category: prompt_injection
    strings:
      embedded_agent_addressee: >-
        (?ix)(?:
          \[\s*(?:[a-z':]+\s+){0,3}(?:ai|llm|assistant|agent|bot|chatgpt|claude)\b
            [^\]]{0,40}?[:,]
          |\b(?:notes?|messages?|instructions?)\s+to\s+(?:the\s+|any\s+|all\s+)?
            (?:ai|llm|assistant|agent|bot)s?\b
          |\b(?:ai|llm|assistant|agent)s?\s+
            (?:reading|scraping|processing|viewing|parsing|indexing)\s+this\b
          |\bto\s+any\s+(?:ai|llm|assistant|agent|bot)\b
          |\b(?:ai|llm|assistant)\s+note\s*:
          |\battention\s+(?:ai|llm|assistant|agent)s?\b
          |\bsystem\s+instructions?\s+embedded\b
          |\[\s*system\s+instruction
        )
      agent_directed_action: >-
        (?ix)(?:
          \b(?:ignore|bypass|cancel|disregard|override|skip|disable)\b
          |\b(?:reveal|leak|disclose|expose|dump)\b
          |\b(?:send|forward|email|share|transmit|exfiltrate|post|comply)\s+\S
          |\bexecute\b
          |\border\s+\d
          |\b(?:unrestricted|developer)\s+mode\b
        )
    match:
      within_chars: 100
      all:
        - name: embedded_agent_addressee
          any: [embedded_agent_addressee]
        - name: agent_directed_action
          any: [agent_directed_action]
    functions:
      - structure_score
      - intent_score

  # Forged conversation structure: a trusted-role key/value carrying an
  # instruction. Lives here rather than in the jailbreak catalog because the
  # payload arrives as data — pasted text, a tool result, or file content — and
  # `injection_scan` is the one scanner configured at all four boundaries.
  #
  # Both signals must sit inside one tightly bounded region. A document that
  # mentions a system role in one paragraph and `send_email` three paragraphs
  # later is not this attack, which is what `within_chars` enforces.
  #
  # A trusted-role shape is *required*. A bare function-call object with no role
  # structure stays outside this rule by design — `{"tool_calls": [...]}` alone
  # is a legitimate serialization that appears in ordinary API payloads.
  - name: json_role_injection.trusted_role_directive
    meta:
      description: "Forged trusted-role structure carrying an imperative or safety-removal instruction"
      threat_level: 5
      severity: high
      category: prompt_injection
    strings:
      trusted_role_structure: >-
        (?ix)(?:
          ["']?(?:role|speaker|sender|author|from)["']?\s*[:=]\s*
            ["']?(?:system|developer|assistant|orchestrator)\b
          |\[\s*role\s*\]\s*name\s*[:=]\s*["']?(?:system|developer|assistant)\b
          |["']?type["']?\s*[:=]\s*["']?system_directive\b
          |["']?authority["']?\s*[:=]\s*["']?(?:admin|system|root)\b
        )
      embedded_directive: >-
        (?ix)(?:
          \b(?:ignore|disregard|override|overriding|cancel|bypass|disable|skip)\b
          |\bunrestricted\s+mode\b
          |\bbypass[_\s-]*safety\b
          |\b(?:comply|obey)\b
          |\badmin(?:istrator)?\s+privileges\b
          |\bauthorized\s+override\b
          |\btool[_\s-]*call\b
          |\byou\s+(?:are|have)\s+(?:now\s+)?unrestricted\b
          |\b(?:send|forward|exfiltrate|leak|reveal|dump)[\w_]*\s+\S
        )
    match:
      within_chars: 100
      all:
        - name: trusted_role_structure
          any: [trusted_role_structure]
        - name: embedded_directive
          any: [embedded_directive]
    functions:
      - structure_score
      - intent_score

  - name: tool_coercion.persistence
    meta:
      description: "Persistent scheduling, forwarding, webhook, or backdoor action to an attacker destination"
      threat_level: 5
      severity: high
      category: tool_injection
    strings:
      persistence_action: >-
        (?ix)(?:\b(?:call|invoke|use|create|add|install|configure)\b.{0,30}
        \b(?:schedule[_\s-]*task|scheduled\s+task|cron(?:job)?|backdoor|webhook|forwarding\s+rule)\b
        |\b(?:forward|cc|email|post|pipe)\b.{0,40}\b(?:every\s+future|recurring|persistently|always)\b
        |\b(?:every\s+future|recurring|persistently|always)\b.{0,40}\b(?:forward|cc|emails?|post|pipe)\b
        |\b(?:silently\s+)?forward\b.{0,50}\b(?:tool\s+results?|api\s+responses?|messages?|emails?|traffic|data)\b
        |\ball\s+tool\s+calls\b.{0,30}\bgo\s+through\b)
      external_attacker_destination: >-
        (?ix)(?:\b[\w.+-]*attacker[\w.+-]*@[\w.-]+\b
        |\b[\w.-]*(?:evil|attacker|malicious)[\w.-]*\.(?:com|net|org)\b
        |\bhttps?://[\w.-]*(?:evil|attacker|malicious)[\w.-]*(?:/[\w?=&%./<>-]*)?
        |\battacker(?:'s)?\s+(?:phone|address|endpoint|account)\b)
    match:
      all:
        - name: persistence_action
          any: [persistence_action]
        - name: external_destination
          any: [external_attacker_destination]
