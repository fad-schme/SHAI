# ==============================================================================
# SQL Injection Pattern Catalog
# ==============================================================================
#
# Compound structural patterns for SQL injection detection. Emit
# `category: sql_injection` with `method_family: regex_catalog`; corroborates
# with any future AST-based SQLi scanner emitting the same category.
#
# Deployment surfaces:
#   - scan_input          — user-facing text; catches SQLi payloads inside
#                           natural-language input
#   - check_tool_call     — argument scanning for tools tagged `sql`/`database`
#   - scan_tool_result    — tool outputs carrying query text (query builders,
#                           logs, results echoing the query back)
#
# Every pattern is compound: a keyword or operator alone is insufficient
# (SQL keywords appear in prose), but structural co-occurrence within a short
# window is diagnostic. `within_chars` tuned per attack — tautology ~60 chars,
# UNION ~30, stacked queries ~20.
#
# Patterns are DBMS-tagged where the attack surface is DBMS-specific
# (xp_cmdshell → MSSQL, INTO OUTFILE → MySQL, DBMS_LOCK → Oracle). Generic
# patterns apply to all engines.
#
# All patterns use verbose+case-insensitive (?ix) so whitespace in the regex
# source is insignificant. This assumes SHAI's normalization pipeline has
# already decoded URL/hex/base64 and folded unicode. Patterns detect
# SQL-native encodings (CHAR(), 0x-hex literals, /**/ inline comments) that
# survive normalization because they are legitimate SQL syntax.
#
# ==============================================================================

patterns:

  # ============================================================================
  # 1. Tautology-based (authentication bypass, boolean-blind primitive)
  # ============================================================================

  - name: sqli.tautology_or_true
    meta:
      description: "OR-based tautology producing always-true predicate (classic authentication bypass)"
      threat_level: 5
      severity: high
      category: sql_injection
    strings:
      or_operator: >-
        (?ix) \b (?: OR | \|\| ) \b
      tautology_equality: >-
        (?ix) (?:
              '[^']{1,12}' \s* = \s* '[^']{1,12}'
            | "[^"]{1,12}" \s* = \s* "[^"]{1,12}"
            | \b \d+ \s* = \s* \d+ \b
            | \b true \b
            | \d+ \s* (?: < | > | <= | >= ) \s* \d+
            | \b null \s+ is \s+ null \b
            | \b \w+ \s+ like \s+ '%' \s* $
        )
    match:
      within_chars: 40
      all:
        - name: has_or_operator
          any: [or_operator]
        - name: has_tautology
          any: [tautology_equality]

  - name: sqli.tautology_with_closure
    meta:
      description: "Tautology with quote closure and comment truncation — high-confidence exploitation form"
      threat_level: 5
      severity: high
      category: sql_injection
    strings:
      quote_break_or: >-
        (?ix) (?:
              ' \s* (?: OR | \|\| )
            | " \s* (?: OR | \|\| )
            | \) \s* (?: OR | \|\| )
        )
      tautology_equality: >-
        (?ix) (?:
              '[^']{1,12}' \s* = \s* '[^']{1,12}'
            | \b \d+ \s* = \s* \d+ \b
            | \b true \b
        )
      truncation_marker: >-
        (?ix) (?: -- [\s\r\n] | \# | /\* | ;\s*-- )
    match:
      within_chars: 60
      all:
        - name: has_break
          any: [quote_break_or]
        - name: has_tautology
          any: [tautology_equality]
        - name: has_truncation
          any: [truncation_marker]

  - name: sqli.and_false_boolean_blind
    meta:
      description: "AND-based boolean-blind primitive with control condition or ASCII/SUBSTRING extraction"
      threat_level: 4
      severity: high
      category: sql_injection
    strings:
      and_operator_in_context: >-
        (?ix) (?: '|"|\)|\d ) \s* \b AND \b
      blind_extraction_function: >-
        (?ix) \b (?:
              substring | substr | mid | ascii | ord | left | right | length | char_length
            | bit_count | elt | conv | bin | hex | unhex
        ) \s* \(
      simple_false_condition: >-
        (?ix) \b (?: \d+ \s* = \s* \d+ | false | null \s+ is \s+ not \s+ null ) \b
    match:
      within_chars: 80
      all:
        - name: has_and_context
          any: [and_operator_in_context]
        - name: has_probe
          any: [blind_extraction_function, simple_false_condition]

  # ============================================================================
  # 2. UNION-based
  # ============================================================================

  - name: sqli.union_select
    meta:
      description: "UNION SELECT construct — canonical UNION-based data extraction"
      threat_level: 5
      severity: high
      category: sql_injection
    strings:
      union_keyword: >-
        (?ix) \b UNION (?: \s+ ALL )? \b
      select_keyword: >-
        (?ix) \b SELECT \b
    match:
      within_chars: 30
      all:
        - name: has_union
          any: [union_keyword]
        - name: has_select
          any: [select_keyword]

  - name: sqli.union_select_null_padding
    meta:
      description: "UNION SELECT with NULL column-count probing — column-count fingerprinting stage"
      threat_level: 5
      severity: high
      category: sql_injection
    strings:
      union_select: >-
        (?ix) \b UNION (?: \s+ ALL )? \s+ SELECT \b
      null_padding: >-
        (?ix) (?:
              (?: NULL | 0x[0-9a-f]+ | 0 ) \s* , \s*
              (?: NULL | 0x[0-9a-f]+ | 0 ) \s* , \s*
              (?: NULL | 0x[0-9a-f]+ | 0 )
        )
    match:
      within_chars: 80
      all:
        - name: has_union_select
          any: [union_select]
        - name: has_null_probe
          any: [null_padding]

  # ============================================================================
  # 3. Stacked queries
  # ============================================================================

  - name: sqli.stacked_ddl
    meta:
      description: "Stacked query terminating with DDL — destructive schema modification"
      threat_level: 5
      severity: critical
      category: sql_injection
    strings:
      statement_terminator: >-
        (?ix) ;
      ddl_keyword: >-
        (?ix) \b (?:
              DROP \s+ (?: TABLE | DATABASE | SCHEMA | INDEX | VIEW | USER | PROCEDURE | FUNCTION )
            | TRUNCATE \s+ TABLE
            | ALTER \s+ (?: TABLE | DATABASE | USER )
            | CREATE \s+ (?: TABLE | DATABASE | USER | PROCEDURE | FUNCTION | TRIGGER )
            | RENAME \s+ TABLE
        ) \b
    match:
      within_chars: 20
      all:
        - name: has_terminator
          any: [statement_terminator]
        - name: has_ddl
          any: [ddl_keyword]

  - name: sqli.stacked_dml_mutation
    meta:
      description: "Stacked query terminating with mutation DML — data tampering or exfiltration"
      threat_level: 5
      severity: high
      category: sql_injection
    strings:
      statement_terminator: >-
        (?ix) ;
      dml_keyword: >-
        (?ix) \b (?:
              DELETE \s+ FROM
            | INSERT \s+ INTO
            | UPDATE \s+ \w+ \s+ SET
            | REPLACE \s+ INTO
            | MERGE \s+ INTO
            | GRANT \s+ (?: ALL | SELECT | INSERT | UPDATE | DELETE )
            | REVOKE \s+
        )
    match:
      within_chars: 20
      all:
        - name: has_terminator
          any: [statement_terminator]
        - name: has_dml
          any: [dml_keyword]

  # ============================================================================
  # 4. Comment / truncation (paired with quote-break context to avoid FPs)
  # ============================================================================

  - name: sqli.quote_break_comment_truncation
    meta:
      description: "Quote-break followed by SQL comment marker — statement truncation to bypass trailing constraints"
      threat_level: 4
      severity: high
      category: sql_injection
    strings:
      quote_break: >-
        (?ix) (?: '\s*|"\s*|\)\s* )
      sql_comment_open: >-
        (?ix) (?: -- [\s\r\n]| -- $ | \#[^\r\n]* | /\* )
      sql_keyword_context: >-
        (?ix) \b (?:
              SELECT | INSERT | UPDATE | DELETE | UNION | WHERE | FROM
            | ORDER \s+ BY | GROUP \s+ BY | HAVING | LIMIT
            | AND | OR | NOT
        ) \b
    match:
      within_chars: 40
      all:
        - name: has_break
          any: [quote_break]
        - name: has_comment
          any: [sql_comment_open]
        - name: has_sql_context
          any: [sql_keyword_context]

  # ============================================================================
  # 5. Time-based blind (per DBMS)
  # ============================================================================

  - name: sqli.time_based_mysql_postgres
    meta:
      description: "Time-based blind SQLi via SLEEP/BENCHMARK/pg_sleep — MySQL and PostgreSQL"
      threat_level: 4
      severity: high
      category: sql_injection
    strings:
      time_function: >-
        (?ix) \b (?:
              sleep \s* \( \s* \d+
            | benchmark \s* \( \s* \d{4,}
            | pg_sleep \s* \( \s* \d+
            | pg_sleep_for \s* \(
            | pg_sleep_until \s* \(
        )
      injection_context: >-
        (?ix) (?:
              \b (?: OR | AND | UNION | SELECT | WHERE | IF | CASE ) \b
            | ' | " | ; | \) \s* AND
        )
    match:
      within_chars: 100
      all:
        - name: has_time_fn
          any: [time_function]
        - name: has_context
          any: [injection_context]

  - name: sqli.time_based_mssql
    meta:
      description: "Time-based blind SQLi via WAITFOR DELAY — Microsoft SQL Server"
      threat_level: 4
      severity: high
      category: sql_injection
    strings:
      waitfor_delay: >-
        (?ix) \b WAITFOR \s+ (?: DELAY | TIME ) \s+ '\d{1,2}:\d{2}:\d{2}
    match:
      within_chars: 40
      all:
        - name: has_waitfor
          any: [waitfor_delay]

  - name: sqli.time_based_oracle
    meta:
      description: "Time-based blind SQLi via DBMS_LOCK.SLEEP or DBMS_PIPE.RECEIVE_MESSAGE — Oracle"
      threat_level: 4
      severity: high
      category: sql_injection
    strings:
      oracle_delay: >-
        (?ix) \b (?:
              DBMS_LOCK \. SLEEP
            | DBMS_PIPE \. RECEIVE_MESSAGE
            | DBMS_SESSION \. SLEEP
            | UTL_INADDR \. GET_HOST_ADDRESS
        ) \s* \(
    match:
      within_chars: 40
      all:
        - name: has_oracle_delay
          any: [oracle_delay]

  # ============================================================================
  # 6. Error-based extraction
  # ============================================================================

  - name: sqli.error_based_extraction_mysql
    meta:
      description: "MySQL error-based extraction via EXTRACTVALUE/UPDATEXML/EXP/FLOOR(RAND())"
      threat_level: 5
      severity: high
      category: sql_injection
    strings:
      error_probe_function: >-
        (?ix) \b (?:
              EXTRACTVALUE \s* \(
            | UPDATEXML \s* \(
            | EXP \s* \( \s* ~
            | FLOOR \s* \( \s* RAND
            | POLYGON \s* \(
            | GEOMETRYCOLLECTION \s* \(
            | LINESTRING \s* \(
        )
      subquery_or_concat: >-
        (?ix) (?:
              \b SELECT \b
            | \b CONCAT \s* \(
            | \b VERSION \s* \(
            | \b DATABASE \s* \(
            | \b USER \s* \(
        )
    match:
      within_chars: 120
      all:
        - name: has_error_fn
          any: [error_probe_function]
        - name: has_subquery
          any: [subquery_or_concat]

  - name: sqli.error_based_type_cast
    meta:
      description: "Error-based extraction via CAST/CONVERT type-mismatch — generic across engines"
      threat_level: 4
      severity: high
      category: sql_injection
    strings:
      cast_convert_call: >-
        (?ix) \b (?: CAST | CONVERT ) \s* \(
      cast_to_numeric: >-
        (?ix) \b AS \s+ (?: INT | INTEGER | NUMERIC | DECIMAL | FLOAT | BIGINT | SIGNED ) \b
      subquery_or_metadata: >-
        (?ix) (?:
              \b SELECT \b
            | \b @@ (?: version | servername | hostname )
            | \b VERSION \s* \(
            | \b USER \s* \(
        )
    match:
      within_chars: 100
      all:
        - name: has_cast
          any: [cast_convert_call]
        - name: has_numeric_target
          any: [cast_to_numeric]
        - name: has_payload
          any: [subquery_or_metadata]

  # ============================================================================
  # 7. Metadata / fingerprinting probes
  # ============================================================================

  - name: sqli.information_schema_probe
    meta:
      description: "INFORMATION_SCHEMA probe — schema enumeration common to MySQL, PostgreSQL, MSSQL"
      threat_level: 4
      severity: medium
      category: sql_injection
    strings:
      info_schema_table: >-
        (?ix) \b INFORMATION_SCHEMA \s* \. \s* (?:
              TABLES | COLUMNS | SCHEMATA | ROUTINES | STATISTICS | USER_PRIVILEGES
            | TABLE_CONSTRAINTS | KEY_COLUMN_USAGE | REFERENTIAL_CONSTRAINTS
        ) \b
    match:
      within_chars: 60
      all:
        - name: has_info_schema
          any: [info_schema_table]

  - name: sqli.dbms_system_catalog_probe
    meta:
      description: "DBMS-specific system catalog probe — SQLite/PostgreSQL/MSSQL/Oracle/MySQL"
      threat_level: 4
      severity: medium
      category: sql_injection
    strings:
      system_catalog_reference: >-
        (?ix) \b (?:
              sqlite_master
            | sqlite_temp_master
            | sqlite_schema
            | pg_catalog \s* \. \s* (?: pg_tables | pg_class | pg_user | pg_shadow | pg_roles )
            | pg_tables
            | pg_shadow
            | pg_user
            | sys \s* \. \s* (?: tables | columns | databases | server_principals | sql_logins )
            | sysobjects
            | syscolumns
            | msdb \s* \. \s* dbo
            | all_tables
            | all_tab_columns
            | user_tables
            | dba_tables
            | dba_users
            | v \$ (?: version | database | instance | session )
            | mysql \s* \. \s* (?: user | db | tables_priv )
        ) \b
    match:
      within_chars: 40
      all:
        - name: has_system_catalog
          any: [system_catalog_reference]

  - name: sqli.version_fingerprint
    meta:
      description: "Database version fingerprint request — @@version, VERSION(), banner queries"
      threat_level: 3
      severity: medium
      category: sql_injection
    strings:
      version_reference: >-
        (?ix) (?:
              @@ version \b
            | @@ servername \b
            | @@ hostname \b
            | \b VERSION \s* \( \s* \)
            | \b SELECT \s+ @@ version
            | \b banner \s+ FROM \s+ v\$version
            | \b sqlite_version \s* \(
        )
    match:
      within_chars: 40
      all:
        - name: has_version_probe
          any: [version_reference]

  - name: sqli.order_by_column_probe
    meta:
      description: "ORDER BY probe with escalating ordinal — column-count discovery stage"
      threat_level: 3
      severity: medium
      category: sql_injection
    strings:
      order_by_ordinal: >-
        (?ix) \b ORDER \s+ BY \s+ \d{1,3} \b
      injection_context: >-
        (?ix) (?:
              '\s*ORDER
            | \) \s* ORDER
            | -- \s | \#
            | \b UNION \b
        )
    match:
      within_chars: 40
      all:
        - name: has_order_ordinal
          any: [order_by_ordinal]
        - name: has_context
          any: [injection_context]

  # ============================================================================
  # 8. Command execution (per DBMS)
  # ============================================================================

  - name: sqli.mssql_command_execution
    meta:
      description: "Microsoft SQL Server command execution via xp_cmdshell or extended procedures"
      threat_level: 5
      severity: critical
      category: sql_injection
    strings:
      mssql_exec_procedure: >-
        (?ix) \b (?:
              xp_cmdshell
            | xp_dirtree
            | xp_fileexist
            | xp_regread
            | xp_regwrite
            | xp_regdeletekey
            | sp_configure
            | sp_OACreate
            | sp_OAMethod
            | sp_executesql
            | EXEC \s+ master \s* \. \.
            | EXECUTE \s+ master \s* \. \.
        ) \b
    match:
      within_chars: 60
      all:
        - name: has_mssql_exec
          any: [mssql_exec_procedure]

  - name: sqli.postgres_command_execution
    meta:
      description: "PostgreSQL command execution via COPY FROM PROGRAM or foreign-language function"
      threat_level: 5
      severity: critical
      category: sql_injection
    strings:
      pg_exec_construct: >-
        (?ix) (?:
              \b COPY \s+ \w+ \s+ (?: FROM | TO ) \s+ PROGRAM \b
            | \b COPY \s+ \( .+? \) \s+ TO \s+ PROGRAM \b
            | \b CREATE \s+ (?: OR \s+ REPLACE \s+ )? FUNCTION \b .+ \b LANGUAGE \s+ (?: C | plpythonu | plperlu ) \b
            | \b LOAD \s+ '[^']+\.so'
        )
    match:
      within_chars: 200
      all:
        - name: has_pg_exec
          any: [pg_exec_construct]

  - name: sqli.oracle_network_exfil
    meta:
      description: "Oracle out-of-band network exfiltration via UTL_HTTP, UTL_INADDR, DBMS_LDAP"
      threat_level: 5
      severity: critical
      category: sql_injection
    strings:
      oracle_network_call: >-
        (?ix) \b (?:
              UTL_HTTP \s* \. \s* (?: request | request_pieces )
            | UTL_INADDR \s* \. \s* get_host_(?: address | name )
            | UTL_SMTP \s* \. \s* (?: mail | data | rcpt )
            | UTL_TCP \s* \. \s* (?: open_connection | write_line )
            | UTL_FILE \s* \. \s* (?: fopen | put_line )
            | DBMS_LDAP \s* \. \s* (?: init | simple_bind_s )
            | HTTPURITYPE \s* \(
        )
    match:
      within_chars: 60
      all:
        - name: has_oracle_net
          any: [oracle_network_call]

  # ============================================================================
  # 9. File I/O (per DBMS)
  # ============================================================================

  - name: sqli.mysql_file_operations
    meta:
      description: "MySQL file read/write via LOAD_FILE, INTO OUTFILE, INTO DUMPFILE"
      threat_level: 5
      severity: critical
      category: sql_injection
    strings:
      mysql_file_construct: >-
        (?ix) (?:
              \b LOAD_FILE \s* \(
            | \b INTO \s+ (?: OUTFILE | DUMPFILE ) \b
            | \b LOAD \s+ DATA \s+ (?: LOCAL \s+ )? INFILE \b
        )
    match:
      within_chars: 40
      all:
        - name: has_mysql_file
          any: [mysql_file_construct]

  - name: sqli.postgres_file_operations
    meta:
      description: "PostgreSQL file read/write via pg_read_file, pg_ls_dir, lo_import/lo_export"
      threat_level: 5
      severity: critical
      category: sql_injection
    strings:
      pg_file_function: >-
        (?ix) \b (?:
              pg_read_file
            | pg_read_binary_file
            | pg_ls_dir
            | pg_stat_file
            | lo_import
            | lo_export
        ) \s* \(
    match:
      within_chars: 40
      all:
        - name: has_pg_file
          any: [pg_file_function]

  # ============================================================================
  # 10. SQLite-specific privilege escalation
  # ============================================================================

  - name: sqli.sqlite_attach_database
    meta:
      description: "SQLite ATTACH DATABASE — arbitrary database file loading, privilege escalation vector"
      threat_level: 4
      severity: high
      category: sql_injection
    strings:
      attach_database: >-
        (?ix) \b ATTACH \s+ DATABASE \b
    match:
      within_chars: 20
      all:
        - name: has_attach
          any: [attach_database]

  # ============================================================================
  # 11. Encoding & filter bypass
  # ============================================================================

  - name: sqli.char_chr_encoding_bypass
    meta:
      description: "String assembly via CHAR/CHR/NCHAR numeric sequences — WAF/filter bypass"
      threat_level: 4
      severity: high
      category: sql_injection
    strings:
      char_encoding_sequence: >-
        (?ix) \b (?: CHAR | CHR | NCHAR | ASCII ) \s* \( \s* \d{1,3} \s* \)
        \s* (?: \|\| | \+ | , ) \s*
        (?: CHAR | CHR | NCHAR | ASCII ) \s* \( \s* \d{1,3} \s* \)
      sql_context: >-
        (?ix) \b (?:
              SELECT | UNION | WHERE | INSERT | UPDATE | DELETE | CONCAT | EXEC
        ) \b
    match:
      within_chars: 200
      all:
        - name: has_char_chain
          any: [char_encoding_sequence]
        - name: has_sql_context
          any: [sql_context]

  - name: sqli.inline_comment_keyword_bypass
    meta:
      description: "SQL keyword split by inline /*..*/ comment — WAF/filter bypass"
      threat_level: 4
      severity: high
      category: sql_injection
    strings:
      split_keyword: >-
        (?ix) \b (?:
              UN /\*[^*]{0,20}\*/ ION
            | SEL /\*[^*]{0,20}\*/ ECT
            | INS /\*[^*]{0,20}\*/ ERT
            | UPD /\*[^*]{0,20}\*/ ATE
            | DEL /\*[^*]{0,20}\*/ ETE
            | DR /\*[^*]{0,20}\*/ OP
            | FR /\*[^*]{0,20}\*/ OM
            | WH /\*[^*]{0,20}\*/ ERE
            | \d+ /\*[^*]{0,20}\*/ = /\*[^*]{0,20}\*/ \d+
        )
    match:
      within_chars: 60
      all:
        - name: has_split_keyword
          any: [split_keyword]

  - name: sqli.hex_literal_payload
    meta:
      description: "Multiple 0x-prefixed hex literals in query context — keyword or string obfuscation"
      threat_level: 3
      severity: medium
      category: sql_injection
    strings:
      hex_literal_chain: >-
        (?ix) \b 0x [0-9a-f]{8,}
        (?: \s* (?: , | \+ | \|\| | UNION | SELECT ) \s* )
        (?: 0x [0-9a-f]{4,} | \b (?: SELECT | UNION | CONCAT ) \b )
      sql_context: >-
        (?ix) \b (?:
              SELECT | UNION | INSERT | UPDATE | DECLARE | EXEC | CONCAT | CAST | CONVERT
        ) \b
    match:
      within_chars: 200
      all:
        - name: has_hex_chain
          any: [hex_literal_chain]
        - name: has_sql_context
          any: [sql_context]

  # ============================================================================
  # 12. NoSQL injection (MongoDB, JSON-based)
  # ============================================================================

  - name: sqli.nosql_mongodb_operator_injection
    meta:
      description: "MongoDB operator injection — $ne, $gt, $regex, $or in argument context"
      threat_level: 4
      severity: high
      category: sql_injection
    strings:
      mongodb_operator_key: >-
        (?ix) (?:
              "\s*\$ (?: ne | gt | gte | lt | lte | in | nin | or | and | not | nor | exists | regex | where | expr ) \s*"
            | '\s*\$ (?: ne | gt | gte | lt | lte | in | nin | or | and | not | nor | exists | regex | where | expr ) \s*'
        ) \s* :
      json_object_context: >-
        (?ix) [\{\[] \s*
    match:
      within_chars: 30
      all:
        - name: has_mongo_operator
          any: [mongodb_operator_key]
        - name: has_json_context
          any: [json_object_context]

  - name: sqli.nosql_mongodb_where_javascript
    meta:
      description: "MongoDB $where clause with JavaScript function body — server-side code execution"
      threat_level: 5
      severity: critical
      category: sql_injection
    strings:
      where_with_js: >-
        (?ix) (?: "\s*\$where\s*"|'\s*\$where\s*' ) \s* :
        \s* (?: " | ' )? \s*
        (?:
              function \s* \(
            | this \s* \.
            | return \s+ (?: true | false | \d+ \s* [=<>] )
        )
    match:
      within_chars: 100
      all:
        - name: has_where_js
          any: [where_with_js]

  # ============================================================================
  # 13. Structural indicator (low-severity, high-context)
  # ============================================================================

  - name: sqli.quote_break_sql_context
    meta:
      description: "Quote-break immediately followed by SQL clause keyword — soft indicator, corroborates other findings"
      threat_level: 3
      severity: medium
      category: sql_injection
    strings:
      quote_then_clause: >-
        (?ix) (?: '\s*|"\s*|\)\s* )
        \b (?:
              OR | AND | UNION | SELECT | INSERT | UPDATE | DELETE
            | FROM | WHERE | ORDER \s+ BY | GROUP \s+ BY | HAVING
            | LIMIT | OFFSET | INTO
        ) \b
    match:
      within_chars: 20
      all:
        - name: has_quote_break_clause
          any: [quote_then_clause]

  - name: sqli.hexchar_string_smuggle
    meta:
      description: "SQL string assembled via CONCAT or || from short literals — payload smuggling"
      threat_level: 3
      severity: medium
      category: sql_injection
    strings:
      concat_chain: >-
        (?ix) (?:
              \b CONCAT \s* \( \s* '[^']{1,4}' \s* , \s* '[^']{1,4}'
            | '[^']{1,4}' \s* \|\| \s* '[^']{1,4}' \s* \|\| \s* '[^']{1,4}'
            | '[^']{1,4}' \s* \+ \s* '[^']{1,4}' \s* \+ \s* '[^']{1,4}'
        )
      sql_context: >-
        (?ix) \b (?:
              SELECT | UNION | WHERE | EXEC | EXECUTE | INSERT | UPDATE
        ) \b
    match:
      within_chars: 120
      all:
        - name: has_concat_chain
          any: [concat_chain]
        - name: has_sql_context
          any: [sql_context]
