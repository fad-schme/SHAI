        (?ix)\b(?:r[ée]p[èe]t(?:er|e|es|ez|ent)|r[ée]cit(?:er|e|es|ez|ent)|reproduis|copi(?:er|e|es|ez|ent)|affich(?:er|e|es|ez|ent)
        |imprim(?:er|e|es|ez|ent)|montr(?:er|e|es|ez|ent)|r[ée]v[èe]l(?:er|e|es|ez|ent)|cit(?:er|e|es|ez|ent)|renvoie|partag(?:er|e|es|ez|ent)
        |list(?:er|e|es|ez|ent)|donn(?:er|e|es|ez|ent)|[ée]cris|r[ée]sum(?:er|e|es|ez|ent)|divulgu(?:er|e|es|ez|ent)|traduis)\b
      protected_object_fr: >-
        (?ix)(?:\b(?:prompt\s+syst[èe]me|invite\s+syst[èe]me|instructions?\s+(?:cach[ée]es?|initiales?|syst[èe]me)
        |message\s+(?:d[ée]veloppeur|syst[èe]me)|consignes?\s+(?:cach[ée]es?|initiales?)
        |r[èe]gles?\s+(?:cach[ée]es?|internes?)|politique\s+(?:de\s+s[ée]curit[ée]|interne))\b
        |\b(?:ton|votre)\s+(?:prompt|invite)\s+(?:complet|entier|original)?\b
        |\bfen[êe]tre\s+de\s+contexte\b)
      referential_target_fr: >-
        (?ix)(?:\b(?:tout\s+)?(?:le\s+)?(?:texte|contenu)\s+(?:qui\s+)?(?:pr[ée]c[èe]de|est\s+au-dessus)\b
        |\bles?\s+(?:instructions?|consignes?)\s+qu(?:i|e)\s+(?:t'ont\s+[ée]t[ée]\s+donn[ée]es?|tu\s+as\s+re[çc]ues?)\b
        |\bavant\s+que\s+je\s+(?:ne\s+)?(?:commence|parle)\b)
      exactness_modifier_fr: >-
        (?ix)\b(?:mot\s+pour\s+mot|textuellement|verbatim|exactement|caract[èe]re\s+par\s+caract[èe]re
        |sans\s+(?:modification|changement)|au\s+format\s+json|bloc\s+de\s+code|int[ée]gralement)\b
    match:
      within_chars: 220
