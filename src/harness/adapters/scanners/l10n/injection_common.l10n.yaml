# injection_common.l10n.yaml — multilingual variants of injection_common.yaml
# =============================================================================
# French, Spanish, German, and Mandarin Chinese variants of the six shared rule
# families. injection_common.yaml loads on every catalog scanner that does not
# override common_patterns, so these rules reach input, output, tool-result and
# file scans alike — an English-only shared catalog left the most-used surface
# in the system monolingual.
#
# Compound structure is preserved, not flattened. Every rule here keeps the
# AND-of-ORs shape and the within_chars window of its English counterpart: a
# translated rule that fired on a single signal would be a different, looser
# rule wearing the same name.
#
# Rule names are <lang>.<base_name>, so _canonical_semantic_name collapses each
# onto its base rule and a bilingual payload scores as one evidence unit.
# Signal-group names match the base rule for the same reason.

patterns:

  # ── French (FR) ──────────────────────────────────────────────────────────

  - name: fr.prompt_extraction.compound
    meta:
      description: "FR — disclosure or exactness request targeting protected prompt content"
      threat_level: 5
      severity: high
      category: prompt_extraction
    strings:
