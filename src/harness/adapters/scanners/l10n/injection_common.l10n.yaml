  # ── Mandarin Chinese (ZH) ────────────────────────────────────────────────
  # No \b word boundaries: Chinese is unsegmented, so \b never fires between
  # Han characters. Latin fragments inside these patterns keep theirs.

  - name: zh.prompt_extraction.compound
    meta:
      description: "ZH — disclosure or exactness request targeting protected prompt content"
      threat_level: 5
      severity: high
      category: prompt_extraction
    strings:
      disclosure_operation_zh: >-
        (?:重复|复述|复制|输出|打印|显示|展示|揭示|透露|泄露|引用|返回|分享|列出|告诉我|写出|翻译)
      protected_object_zh: >-
        (?:系统提示(?:词|语)?|系统消息|系统指令|隐藏(?:的)?(?:提示|指令|规则)
        |初始(?:提示|指令|上下文)|开发者(?:消息|指令)|内部(?:规则|政策)|安全(?:政策|规则)
        |你的(?:完整|原始)?提示(?:词|语)?|上下文窗口)
      referential_target_zh: >-
        (?:(?:上面|上方|之前|以上)(?:的)?(?:全部|所有)?(?:文本|内容|文字)
        |(?:给你|你收到)(?:的)?(?:指令|指示|说明)
        |在我(?:开始)?(?:说话|提问)(?:之)?前)
      exactness_modifier_zh: >-
        (?:逐字|一字不差|原封不动|完整地?|精确地?|逐个字符|不加修改|json\s*格式|代码块)
    match:
      within_chars: 220
      all:
        - name: disclosure_request
          any: [disclosure_operation_zh, exactness_modifier_zh]
        - name: protected_target
          any: [protected_object_zh, referential_target_zh]

