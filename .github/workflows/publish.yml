name: Publish

# Builds the sdist + wheel and publishes to PyPI via Trusted Publishing (OIDC).
# No API token exists anywhere in this repo or in GitHub secrets — PyPI verifies
# the workflow identity directly, so there is no long-lived credential to leak.
#
# One-time setup on PyPI (https://pypi.org/manage/account/publishing/):
#   PyPI project name : shai
#   Owner             : fad-schme
#   Repository        : SHAI
#   Workflow          : publish.yml
#   Environment       : pypi          (testpypi for the TestPyPI publisher)
# Until the project exists on PyPI, register it as a *pending* publisher — the
# first successful run creates it.
#
# Triggers:
#   - push of a v* tag  → build, then publish to PyPI after environment approval
#   - manual dispatch   → build, then publish to TestPyPI (rehearsal)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false   # never cancel a run that may already have uploaded

jobs:

  # ── Job 1: Build ─────────────────────────────────────────────────────────
  # Builds both distributions and refuses to go further if the version in
  # pyproject.toml does not match the tag being released. A mismatch here is
  # how a wrong version reaches PyPI, and a PyPI filename can never be reused.
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install build tooling
        run: pip install build twine

      - name: Verify pyproject version matches the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PROJECT=$(python -c "import tomllib,pathlib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          if [ "$TAG" != "$PROJECT" ]; then
            echo "::error::Tag v$TAG does not match pyproject.toml version $PROJECT"
            exit 1
          fi
          echo "Releasing version $PROJECT"

      - name: Build sdist and wheel
        run: python -m build

      - name: Check metadata renders on PyPI
        run: twine check --strict dist/*

      - name: Verify the wheel installs and imports
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install --quiet dist/*.whl
          /tmp/smoke/bin/python -c "import harness"
          /tmp/smoke/bin/shai --help > /dev/null

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error


  # ── Job 2: Publish to TestPyPI ───────────────────────────────────────────
  # Manual dispatch only — the rehearsal step. Verifies the upload path and the
  # rendered project page without burning a real PyPI filename.
  publish-testpypi:
    name: Publish to TestPyPI
    needs: build
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/shai
    permissions:
      id-token: write   # required for Trusted Publishing; the only credential in play

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true


  # ── Job 3: Publish to PyPI ───────────────────────────────────────────────
  # Tag push only. The `pypi` environment is where the human gate lives: add a
  # required reviewer in Settings → Environments so a tag push alone can never
  # publish. Upload is irreversible — a released version cannot be replaced.
  publish-pypi:
    name: Publish to PyPI
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/shai
    permissions:
      id-token: write   # mints the short-lived OIDC token PyPI verifies

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
        # Publishes with PEP 740 attestations, signed with the workflow identity.
