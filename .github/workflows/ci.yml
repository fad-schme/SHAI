name: CI

# Runs on every PR targeting main and on every push to main.
# Security checks must pass before a codeowner review is meaningful.
# Nothing in this workflow pushes to main — that is gated by branch protection.

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  push:
    branches: [main]    # runs after merge to keep main green
  schedule:
    - cron: "0 6 * * *"   # nightly perf-budget trend run
  workflow_dispatch: {}   # manual perf-budget run

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true  # cancel stale runs when new commits are pushed to the same PR

jobs:

  # ── Job 1: Unit tests ────────────────────────────────────────────────────
  unit-tests:
    name: Unit tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # Every version `requires-python` claims. Testing only the lowest let a
        # 3.12+ regression ship green.
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      # Floor, not a target. tests/unit/ measured 81% on 2026-08-12; the gate
      # sits just below so ordinary churn does not fail the build, and exists to
      # catch a real regression. Ratchet it upward as coverage improves — never
      # downward to make a red build green.
      - name: Run unit tests with coverage
        run: >-
          pytest tests/unit/ -v --tb=short
          --cov=src/harness --cov-report=term-missing --cov-fail-under=78


  # ── Job 2: Security invariant tests ─────────────────────────────────────
  # These are non-negotiable. They verify properties that must hold on every
  # code path regardless of configuration:
  #   - No raw text in any AuditEvent field
  #   - Dispatch token forgery resistance
  # A failure here means a boundary invariant is broken. The PR is rejected.
  security-invariants:
    name: Security invariants
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Run security invariant tests
        run: pytest tests/security/ -v --tb=short


  # ── Job 3: Contract tests ────────────────────────────────────────────────
  # Every adapter (scanner, audit sink, policy engine, tool source, secrets
  # provider) must pass the same contract suite regardless of package.
  # A failure means a reference adapter no longer conforms to its protocol.
  contract-tests:
    name: Contract tests
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Run contract tests
        run: pytest tests/contracts/ -v --tb=short


  # ── Job 4: Dependency audit ──────────────────────────────────────────────
  # Checks all dependencies for known CVEs using pip-audit.
  # Fails the PR if any HIGH or CRITICAL vulnerability is found in a direct
  # or transitive dependency.
  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install pip-audit
        # setuptools is upgraded too: it is ambient in the runner image rather
        # than a SHAI dependency, and a stale one fails the audit on a CVE that
        # has nothing to do with this project.
        run: pip install --upgrade pip setuptools pip-audit

      - name: Install project dependencies
        run: pip install -e ".[dev]"

      - name: Audit dependencies for CVEs
        # --skip-editable excludes SHAI's own editable install, which pip-audit
        # cannot resolve against PyPI. --strict is omitted deliberately: it makes
        # that skip fatal, and it is not what gates CVEs — pip-audit exits
        # non-zero on any vulnerability found regardless.
        run: |
          pip-audit \
            --skip-editable \
            --vulnerability-service pypi \
            --format columns


  # ── Job 5: Lint ──────────────────────────────────────────────────────────
  # ruff over src/, tests/ and examples/. examples/ is included deliberately:
  # they are the first code a new user runs, so they are held to the same bar
  # as the library. 32 pre-existing violations were cleared on 2026-08-12
  # before this job was added.
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff
        run: ruff check src/ tests/ examples/


  # ── Job 6: Static analysis ───────────────────────────────────────────────
  # Bandit scans for common security issues in Python code:
  # hardcoded secrets, use of unsafe functions, shell injection, etc.
  # Scoped to src/ only — test code is excluded.
  static-analysis:
    name: Static analysis (bandit)
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install bandit
        run: pip install bandit[toml]

      - name: Run bandit
        run: |
          bandit \
            --recursive src/ \
            --severity-level medium \
            --confidence-level medium \
            --format txt


  # ── Job 7: Secret scanning ───────────────────────────────────────────────
  # Catches accidentally committed credentials, API keys, and tokens
  # before they land in the repo history.
  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0    # full history — scan all commits in the PR, not just HEAD

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


  # ── Job 8: Performance budget ────────────────────────────────────────────
  # The `perf` marker is deselected by default (see pyproject.toml), so these
  # need `-m perf` to run at all. `-s` is deliberate: the tests print their
  # measurements, and the numbers in the log are the point — a pass tells you
  # nothing a regression from 3 ms to 90 ms would not.
  #
  # Runs nightly (schedule) or on manual dispatch only — not on every PR/push.
  # These assert wall-clock thresholds on a shared runner whose neighbours
  # SHAI does not control, so they are a trend signal, not a merge criterion.
  # Deliberately NOT in the gate's `needs`. Promote to a required check only
  # alongside a dedicated runner.
  perf-budget:
    name: Performance budget
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Run performance budget
        run: pytest tests/perf/ -m perf -v -s --tb=short


  # ── Gate job ─────────────────────────────────────────────────────────────
  # This is the single required status check in branch protection.
  # Add "ci / All checks passed" as the required check in branch settings —
  # not the individual jobs. This way adding/removing jobs never requires
  # updating the branch protection rule.
  #
  # Codeowner review is only requested AFTER this job passes.
  # Branch protection enforces: required check ✅ → then codeowner review.
  all-checks-passed:
    name: All checks passed
    needs:
      - unit-tests
      - security-invariants
      - contract-tests
      - dependency-audit
      - static-analysis
      - lint
      - secret-scan
    runs-on: ubuntu-latest
    # always() so it still runs if a dependency job was skipped or failed;
    # excluded on schedule/workflow_dispatch since those runs only exercise perf-budget.
    if: always() && github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
    permissions:
      contents: read

    steps:
      - name: Check all jobs passed
        # The needs context is passed through the environment, not piped: `python3 -`
        # takes its script from stdin, so a heredoc and a pipe cannot both use it.
        # Using env also keeps workflow context out of the shell command line,
        # which is GitHub's documented defence against script injection.
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          python3 - << 'EOF'
          import json, os, sys
          results = json.loads(os.environ["NEEDS_JSON"])
          failed = [
              name for name, outcome in results.items()
              if outcome.get("result") not in ("success", "skipped")
          ]
          if failed:
              print(f"❌ Failed jobs: {', '.join(failed)}")
              sys.exit(1)
          print("✅ All required checks passed.")
          EOF