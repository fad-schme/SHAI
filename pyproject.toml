[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "shai-harness"
version = "0.7.1"
description = "Secure Harness AI — control-plane SDK for production agents"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
  { name = " A Diaz-Schmeier", email = "ad-schme@aibestlabs.com" },
]
keywords = [
    "ai-agents", "secure harnes", "llm-security", "guardrails",
    "audit", "policy-engine", "agent-security", "agent-loop security", 
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "aiosqlite>=0.20",
]

[project.urls]
Homepage   = "https://shai.aibestlabs.com"
Repository = "https://github.com/fad-schme/SHAI"
Changelog  = "https://github.com/fad-schme/SHAI/blob/main/CHANGELOG.md"
Issues     = "https://github.com/fad-schme/SHAI/issues"

[project.optional-dependencies]
shell = [
    # bashlex backs command_injection_scan. Optional because the scanner is
    # only useful where the deployment registers shell-executing tools.
    "bashlex>=0.18",
]
dev = [
    "bashlex>=0.18",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "bandit",
    "pip-audit",
    "ruff",
    "pre-commit",
    "pip-tools",
    "cyclonedx-bom",
    "python-semantic-release",
    "sigstore",
    # Transitive via sigstore. Pinned forward for PYSEC-2026-3552; dev-only,
    # never a runtime dependency of the published package.
    "cryptography>=50.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/harness", "src/harness_cli"]
# Include bundled YAML pattern catalogs and the py.typed marker
artifacts = [
    "src/harness/adapters/scanners/*.yaml",
    "src/harness/adapters/scanners/l10n/*.yaml",
    "src/harness/py.typed",
]

[tool.hatch.build.targets.sdist]
include = [
    "src/",
    "tests/",
    "LICENSE",
    "NOTICE",
    "README.md",
    "CHANGELOG.md",
    "THREAT_MODEL.md",
    "CLA.md",
    "CODE_OF_CONDUCT.md",
    "CONTRIBUTING.md",
    "SECURITY.md",
    "harness.yaml.example",
    "pyproject.toml",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Wall-clock measurement, not correctness: 15 tests that cost more than the
# other ~1600 combined, and whose thresholds are sensitive to whatever else the
# machine is doing. Excluded by default; run explicitly with `-m perf`.
markers = ["perf: wall-clock performance measurement (deselected by default)"]
addopts = "-m 'not perf'"


[project.scripts]
shai = "harness_cli.main:main"

[tool.semantic_release]
version_variable = "pyproject.toml:version"
branch = "main"
commit_message = "chore(release): {version}"
changelog_file = "CHANGELOG.md"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = [
    "E501",
    "E402",
    "E702",
    "E741",
    "F841",
    "B007",
    "B017",
    "B023",
    "B905",
    "SIM102",
    "SIM105",
    "SIM115",
    "F811",
]