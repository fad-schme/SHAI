# config/harness.yaml — operator config for the examples.
version: 1
tenant_id: "shai-demo"

scan_input:
  enabled: true
  block_at: high
  action: block               # block | alert | redact
  # on_error: what happens when a scanner raises an exception.
  #   fail_closed — treat as BLOCK (default, correct security posture)
  #   fail_open   — treat as empty findings (use during rollout / testing)
  #   degrade     — treat as WARN; content passes, audit event flagged
  on_error: fail_closed
  scanners:
    - name: regex_pii
      action: redact          # redact PII instead of blocking
      redact_with: "***"      # placeholder (use {category} for category name)
    - name: injection_scan
      action: block           # always hard-block injection attempts

scan_output:
  enabled: true
  block_at: high
  action: block
  on_error: fail_closed
  scanners:
    - name: regex_pii
      action: redact
      redact_with: "[REDACTED:{category}]"

scan_tool_result:
  enabled: true
  block_at: high
  action: block
  on_error: fail_closed
  scanners:
    - name: injection_scan
    - name: identity_spoof_scan
    # Guardrail-integrity rules apply here too: an attacker-controlled document
    # or search result carrying "ignore your previous instructions" is an
    # indirect-injection payload, not a user asking for a jailbreak.
    - name: jailbreak_scan

# ── File upload scanning ──────────────────────────────────────────────────
# The structural pass always runs and needs no configuration: MIME, size,
# extension, PDF JavaScript, SVG scripts and external references, EXIF, Office
# macros, and archive inspection across the zip family, gzip/bzip2/xz, and tar
# (bombs, path traversal, symlink escapes; 7z/rar reported as uninspectable).
# `scanners` is the content chain that runs after it, over text extracted from
# the file and the EXIF/XMP blob for images — configured exactly like
# scan_input.
scan_file:
  enabled: false
  block_at: high
  action: block
  on_error: fail_closed
  max_size_mb: 50
  scanners:
    - name: injection_scan
    - name: jailbreak_scan
    - name: regex_pii

scan_mcp_metadata:
  enabled: true
  block_at: medium      # medium is correct — metadata injection is high signal
  action: block
  scanners:
    - name: mcp_metadata_scan

check_tool_call:
  rate_limit:
    enabled: true
    window_seconds: 60
    max_calls_per_window: 30
    max_calls_per_tool: 10
  scanners:
    - name: regex_pii
  scan_args_for_tags:
    - sensitive

policy:
  rules:
    - id: allow_local_tools
      match:
        transport: [local, skill]
      action: allow
    - id: deny_mcp_by_default
      match:
        transport: [mcp]
      action: deny
      reason: "MCP tools require explicit agent-level allow rule"

audit_sinks:
  - name: file
    config:
      path: ./logs/audit.jsonl
